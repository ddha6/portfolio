<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品管理后台</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f3f2ef;--card:rgba(255,255,255,.72);--text:#1d1d1f;
  --text2:#6e6e73;--text3:#aeaeb2;--accent:#0071e3;
  --border:rgba(255,255,255,.55);--radius:16px;--radius-sm:12px;
  --shadow:0 8px 32px rgba(0,0,0,.05),0 2px 6px rgba(0,0,0,.03),inset 0 1px 0 rgba(255,255,255,.6);
  --ease:cubic-bezier(.16,1,.3,1);
}
html{-webkit-font-smoothing:antialiased}
body{
  font-family:'Inter','Noto Sans SC',system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;height:100vh;overflow:hidden;
}
.app{display:flex;height:100vh}
::selection{background:rgba(0,113,227,.2)}

/* ====== Sidebar ====== */
.sidebar{
  width:300px;flex-shrink:0;display:flex;flex-direction:column;
  background:rgba(255,255,255,.4);backdrop-filter:blur(30px) saturate(200%);-webkit-backdrop-filter:blur(30px) saturate(200%);
  border-right:1px solid rgba(0,0,0,.06);
}
.sidebar-header{
  padding:20px 20px 12px;display:flex;align-items:center;justify-content:space-between;
}
.sidebar-header h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
.sidebar-header .count{font-size:12px;color:var(--text3);background:rgba(0,0,0,.04);padding:3px 10px;border-radius:100px}
.sidebar-actions{display:flex;gap:8px;padding:0 20px 14px}
.btn{
  font-size:12px;font-weight:500;padding:7px 16px;border-radius:100px;border:none;cursor:pointer;
  transition:all .25s;letter-spacing:.02em;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{box-shadow:0 4px 14px rgba(0,113,227,.3)}
.btn-outline{background:rgba(0,0,0,.03);color:var(--text2)}
.btn-outline:hover{background:rgba(0,0,0,.06);color:var(--text)}
.btn-sm{font-size:11px;padding:5px 12px}
.btn-danger{color:#d32f2f;background:rgba(211,47,47,.06)}
.btn-danger:hover{background:rgba(211,47,47,.12)}

.work-list{flex:1;overflow-y:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:4px}
.work-list-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);
  cursor:pointer;transition:all .2s;position:relative;
}
.work-list-item:hover{background:rgba(0,0,0,.03)}
.work-list-item.active{background:rgba(0,113,227,.08);box-shadow:inset 0 0 0 1px rgba(0,113,227,.15)}.work-list-item.dragging{opacity:.35;transform:scale(.96)}.work-list-item.drag-over{outline:2px solid var(--accent);outline-offset:-2px;border-radius:var(--radius-sm)}
.work-list-item-thumb{
  width:48px;height:48px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#e8e6e2;
}
.work-list-item-thumb img{width:100%;height:100%;object-fit:cover}
.work-list-item-info{flex:1;min-width:0}
.work-list-item-title{font-size:13px;font-weight:520;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.work-list-item-meta{font-size:11px;color:var(--text3);margin-top:2px}
.work-list-item-del{
  width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--text3);opacity:0;transition:all .2s;flex-shrink:0;
}
.work-list-item:hover .work-list-item-del{opacity:1}
.work-list-item-del:hover{color:#d32f2f;background:rgba(211,47,47,.08)}

/* ====== Editor ====== */
.editor{flex:1;overflow-y:auto;padding:24px 32px;display:flex;flex-direction:column;gap:24px}
.editor-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:14px}
.editor-section{
  background:var(--card);backdrop-filter:blur(28px) saturate(200%);-webkit-backdrop-filter:blur(28px) saturate(200%);
  border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);
}
.editor-section h3{font-size:13px;font-weight:600;letter-spacing:.03em;margin-bottom:16px;color:var(--text2);text-transform:uppercase}
.form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.form-row:last-child{margin-bottom:0}
.form-group{flex:1;min-width:150px}
.form-group label{display:block;font-size:11px;font-weight:500;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.form-group input,.form-group textarea,.form-group select{
  width:100%;font-family:inherit;font-size:13px;padding:9px 12px;
  border:1px solid rgba(0,0,0,.08);border-radius:10px;
  background:rgba(255,255,255,.5);outline:none;transition:border .2s;
}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:60px}

/* Thumbnail upload */
.thumb-upload{
  width:160px;height:120px;border-radius:var(--radius-sm);overflow:hidden;
  background:#e8e6e2;cursor:pointer;position:relative;border:2px dashed rgba(0,0,0,.1);
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.thumb-upload:hover{border-color:var(--accent);background:rgba(0,113,227,.02)}
.thumb-upload img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.thumb-upload .placeholder{font-size:12px;color:var(--text3);text-align:center;line-height:1.4}

/* Detail blocks */
.blocks-list{display:flex;flex-direction:column;gap:8px}
.block-item{
  display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius-sm);
  background:rgba(0,0,0,.015);border:1px solid rgba(0,0,0,.04);transition:all .2s;
}
.block-item:hover{border-color:rgba(0,0,0,.1)}
.block-item.dragging{opacity:.4}
.block-handle{cursor:grab;color:var(--text3);flex-shrink:0}
.block-handle svg{width:16px;height:16px}
.block-type{
  font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  padding:3px 8px;border-radius:6px;flex-shrink:0;
}
.block-type.image{background:rgba(0,113,227,.08);color:var(--accent)}
.block-type.text{background:rgba(100,180,100,.1);color:#2e7d32}
.block-preview{flex:1;min-width:0;font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block-preview img{width:60px;height:45px;object-fit:cover;border-radius:6px;vertical-align:middle}
.block-delete{
  width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--text3);cursor:pointer;transition:all .2s;flex-shrink:0;
}
.block-delete:hover{color:#d32f2f;background:rgba(211,47,47,.08)}
.block-add-row{display:flex;gap:8px;margin-top:8px}

/* Preview modal */
.preview-modal{
  position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:all .3s;
}
.preview-modal.open{visibility:visible;opacity:1}
.preview-content{
  width:400px;max-height:85vh;overflow-y:auto;background:var(--bg);
  border-radius:var(--radius);box-shadow:0 24px 64px rgba(0,0,0,.2);
  padding:0;
}
.preview-close{
  position:sticky;top:0;z-index:2;float:right;margin:12px;width:32px;height:32px;
  border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;border:none;transition:all .2s;
}
.preview-close:hover{background:rgba(0,0,0,.7)}
.preview-img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.preview-info{padding:20px}
.preview-info h2{font-size:16px;font-weight:550;margin-bottom:4px}
.preview-info .cat{font-size:11px;color:var(--accent);margin-bottom:8px}
.preview-info .desc{font-size:13px;color:var(--text2);line-height:1.7}
.preview-blocks{padding:0}
.preview-blocks img{width:100%;display:block}
.preview-blocks .text-block{padding:20px}
.preview-blocks .text-block h3{font-size:15px;margin-bottom:6px}
.preview-blocks .text-block p{font-size:13px;color:var(--text2);line-height:1.7}

/* Toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;
  padding:10px 24px;border-radius:100px;font-size:13px;font-weight:500;
  background:var(--text);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.2);
  opacity:0;transition:opacity .3s;
}
.toast.show{opacity:1}

@media(max-width:768px){
  .app{flex-direction:column}
  .sidebar{width:100%;max-height:40vh;flex-shrink:1}
  .editor{padding:16px}
  .form-row{flex-direction:column}
}
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>作品管理</h1>
      <span class="count" id="workCount">0</span>
    </div>
    <div class="sidebar-actions">
      <button class="btn btn-primary" onclick="addWork()">+ 新建作品</button>
      <button class="btn btn-outline btn-sm" onclick="exportData()">导出</button>

</div>

<div class="toast" id="toast"></div>

// Load
var works;
try{var d=localStorage.getItem('pf_works');works=d?JSON.parse(d):DEFAULT_WORKS}catch(e){works=DEFAULT_WORKS}
var selectedId=null,editingBlockIdx=null,workDragId=null;
var toastTimer;

function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},2000)}
function save(){try{localStorage.setItem('pf_works',JSON.stringify(works));toast('已保存 ✓')}catch(e){toast('保存失败')};refreshList()}
function downloadDataJS(){var js='var DEFAULT_WORKS='+JSON.stringify(works)+';';var b=new Blob([js],{type:'application/javascript'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='data.js';a.click();toast('已下载 data.js，双击 deploy.bat 即可上线 ✓')}

// ====== Sidebar List ======
function refreshList(){
  var list=document.getElementById('workList');
  document.getElementById('workCount').textContent=works.length;
  list.innerHTML=works.map(function(w){
    var active=selectedId===w.id?' active':'';
    return'<div class="work-list-item'+active+'" draggable="true" data-id="'+w.id+'" onclick="selectWork('+w.id+')" ondragstart="workDragStart(event,'+w.id+')" ondragend="workDragEnd(event)" ondragover="workDragOver(event)" ondragleave="workDragLeave(event)" ondrop="workDrop(event,'+w.id+')">'+
      '<div class="work-list-item-thumb"><img src="'+esc(w.img)+'" onerror="this.style.display=\'none\'"></div>'+
      '<div class="work-list-item-info"><div class="work-list-item-title">'+esc(w.title)+'</div><div class="work-list-item-meta">'+esc(w.category)+' · '+esc(w.client||'')+'</div></div>'+
      '<div class="work-list-item-del" onclick="event.stopPropagation();deleteWork('+w.id+')" title="删除">✕</div>'+
    '</div>';
  }).join('');
}

function selectWork(id){selectedId=id;refreshList();renderEditor()}

function addWork(){
  var maxId=0;works.forEach(function(w){if(w.id>maxId)maxId=w.id});
  var w={id:maxId+1,title:'新作品',category:'电商设计',client:'',price:'¥299',img:'',detail:[{t:'image'},{t:'text',title:'项目背景',c:''}]};
  works.unshift(w);save();selectedId=w.id;refreshList();renderEditor();toast('已创建新作品')
}

function deleteWork(id){
  if(!confirm('确定删除这个作品？'))return;
  works=works.filter(function(w){return w.id!==id});
  if(selectedId===id)selectedId=null;save();renderEditor();toast('已删除')
}

// ====== Work Drag Sort ======
function workDragStart(e,id){workDragId=id;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move'}
function workDragEnd(e){document.querySelectorAll('.work-list-item').forEach(function(el){el.classList.remove('dragging','drag-over')})}
function workDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';var el=e.currentTarget;if(!el.classList.contains('dragging')){document.querySelectorAll('.work-list-item.drag-over').forEach(function(x){x.classList.remove('drag-over')});el.classList.add('drag-over')}}
function workDragLeave(e){var el=e.currentTarget;if(e.relatedTarget&&el.contains(e.relatedTarget))return;el.classList.remove('drag-over')}
function workDrop(e,targetId){e.preventDefault();var el=e.currentTarget;el.classList.remove('drag-over');if(workDragId===null||workDragId===targetId)return;var fromIdx=-1,toIdx=-1;for(var i=0;i<works.length;i++){if(works[i].id===workDragId)fromIdx=i;if(works[i].id===targetId)toIdx=i}if(fromIdx===-1||toIdx===-1)return;var moved=works.splice(fromIdx,1)[0];works.splice(toIdx,0,moved);save();refreshList()}

// ====== Editor ======
function renderEditor(){
  var editor=document.getElementById('editor');
  if(!selectedId){editor.innerHTML='<div class="editor-empty">← 选择或创建一个作品开始编辑</div>';return}
  var w=works.find(function(x){return x.id===selectedId});if(!w)return;

  var detailBlocks='';
  for(var i=0;i<w.detail.length;i++){
    var b=w.detail[i];
    if(b.t==='image'){
      var hasSrc=b.src&&b.src.length>10;
      detailBlocks+='<div class="block-item" draggable="true" data-idx="'+i+'">'+
        '<div class="block-handle">⋮⋮</div><span class="block-type image">图片</span>'+
        '<div class="block-preview" style="cursor:pointer" onclick="event.stopPropagation();editBlockImg('+i+')" title="点击更换图片">'+(hasSrc?('<img src="'+esc(b.src)+'">'):'<span style="font-size:11px;color:var(--text3)">（使用主图 — 点击上传专属图）</span>')+'</div>'+
        '<div class="block-delete" onclick="deleteBlock('+i+')">✕</div></div>';
    } else {
      var txt=b.c||'';if(txt.length>30)txt=txt.substring(0,30)+'…';
      detailBlocks+='<div class="block-item" draggable="true" data-idx="'+i+'">'+
        '<div class="block-handle">⋮⋮</div><span class="block-type text">文字</span>'+
        '<div class="block-preview"><b>'+esc(b.title||'')+'</b> '+esc(txt)+'</div>'+
        '<div class="block-delete" onclick="deleteBlock('+i+')">✕</div></div>';
    }
  }

  editor.innerHTML=
    '<div class="editor-section">'+
      '<h3>基本信息</h3>'+
      '<div class="form-row">'+
        '<div class="form-group" style="flex:2"><label>作品名称</label><input value="'+esc(w.title)+'" id="edTitle"></div>'+
        '<div class="form-group"><label>分类</label><select id="edCat"><option value="电商设计"'+(w.category==='电商设计'?' selected':'')+'>电商设计</option><option value="海报设计"'+(w.category==='海报设计'?' selected':'')+'>海报设计</option></select></div>'+
      '</div>'+
      '<div class="form-row">'+
        '<div class="form-group"><label>客户</label><input value="'+esc(w.client||'')+'" id="edClient"></div>'+
        '<div class="form-group"><label>价格</label><input value="'+esc(w.price||'')+'" id="edPrice" placeholder="如 ¥299"></div>'+
      '</div>'+
      '<div class="form-row">'+
        '<div class="form-group"><label>主图（缩略图）</label>'+
          '<div class="thumb-upload" id="thumbUpload" onclick="document.getElementById(\'thumbInput\').click()">'+
            (w.img?'<img src="'+esc(w.img)+'">':'<span class="placeholder">点击上传<br>或拖拽图片</span>')+
          '</div>'+
        '</div>'+
        '<div class="form-group"><label>操作</label><br>'+
          '<button class="btn btn-outline" onclick="openPreview()">预览详情页</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="editor-section">'+
      '<h3>主图集（可用于轮播，第一张为封面）</h3>'+
      '<div style="display:flex;gap:10px;overflow-x:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory" id="galleryThumbs">'+
        (!w.gallery||w.gallery.length===0?('<span style="font-size:12px;color:var(--text3);flex-shrink:0;padding:20px">暂无主图，请上传</span>'):'')+
        (w.gallery||[]).map(function(src,i){return'<div style="position:relative;flex-shrink:0;width:100px;height:100px;border-radius:12px;overflow:hidden;cursor:pointer;border:3px solid '+(i===0?'var(--accent)':'rgba(0,0,0,.06)')+';scroll-snap-align:start;transition:border .2s" onclick="setCover('+i+')" title="'+(i===0?'当前封面':'点击设为封面')+'">'+
          '<img src="'+esc(src)+'" style="width:100%;height:100%;object-fit:cover">'+
          '<div style="position:absolute;bottom:0;left:0;right:0;background:'+(i===0?'var(--accent)':'rgba(0,0,0,.55)')+';color:#fff;font-size:10px;text-align:center;padding:4px;font-weight:'+(i===0?'600':'400')+'">'+(i===0?'★ 封面':'点击设封面')+'</div>'+
          '<div style="position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer" onclick="event.stopPropagation();removeGalleryImg('+i+')">✕</div>'+
        '</div>'}).join('')+
      '</div>'+
      '<button class="btn btn-outline btn-sm" onclick="document.getElementById(\'galleryInput\').click()">+ 上传主图</button>'+
      '<p style="font-size:11px;color:var(--text3);margin-top:6px">← 左右滑动查看 · 点击图片设为封面 · 封面同步为缩略图</p>'+
    '</div>'+
    '<div class="editor-section">'+
      '<h3>详情内容模块（淘宝式下滑详情）</h3>'+
      '<div class="blocks-list">'+detailBlocks+'</div>'+
      '<div class="block-add-row">'+
        '<button class="btn btn-outline" onclick="addBlock(\'image\')">+ 添加图片模块</button>'+
        '<button class="btn btn-outline" onclick="addBlock(\'text\')">+ 添加文字模块</button>'+
      '</div>'+
      '<p style="font-size:11px;color:var(--text3);margin-top:8px">拖拽模块可排序 · 点击 ✕ 删除 · 点击图片可重新上传</p>'+
    '</div>'+
    '<div style="display:flex;gap:10px">'+
      '<button class="btn btn-primary" onclick="saveEditor()">保存修改</button>'+
      '<button class="btn btn-primary" style="background:#e53935;border-color:#e53935" onclick="deployToGitHub()">🚀 一键发布上线</button>'+
      '<button class="btn btn-outline" onclick="openPreview()">预览</button>'+
    '</div>';

  attachBlockDrag();
  setupThumbDrop();
}

function saveEditor(){
  var w=works.find(function(x){return x.id===selectedId});if(!w)return;
  w.title=document.getElementById('edTitle').value||'未命名';
  w.category=document.getElementById('edCat').value;
  w.client=document.getElementById('edClient').value;
  w.price=document.getElementById('edPrice').value;
  if(w.specs){w.specs['客户']=w.client;w.specs['价格']=w.price}
  // Sync cover from gallery
  if(w.gallery&&w.gallery.length>0)w.img=w.gallery[0];
  save();renderEditor();toast('已保存 ✓')
}

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ====== Thumbnail Upload ======
document.getElementById('thumbInput').addEventListener('change',function(){
  if(!this.files||!this.files[0])return;
  var w=works.find(function(x){return x.id===selectedId});if(!w)return;
  resizeImage(this.files[0],function(b64){w.img=b64;renderEditor();save()});
  this.value='';
});

function setupThumbDrop(){
  var el=document.getElementById('thumbUpload');if(!el)return;
  el.addEventListener('dragover',function(e){e.preventDefault();el.style.borderColor='var(--accent)'});
  el.addEventListener('dragleave',function(){el.style.borderColor=''});
  el.addEventListener('drop',function(e){e.preventDefault();el.style.borderColor='';
    var w=works.find(function(x){return x.id===selectedId});if(!w||!e.dataTransfer.files[0])return;
    resizeImage(e.dataTransfer.files[0],function(b64){w.img=b64;renderEditor();save()});
  });
}

function resizeImage(file,cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,max=1200;
      if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}
      var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',.85));
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

// ====== Detail Blocks ======
function addBlock(type){
  var w=works.find(function(x){return x.id===selectedId});if(!w)return;
  if(type==='image'){
    editingBlockIdx=w.detail.length;
    document.getElementById('blockImgInput').click();
  } else {
    w.detail.push({t:'text',title:'新段落',c:''});
    renderEditor();save();
  }
}

document.getElementById('blockImgInput').addEventListener('change',function(){
  if(!this.files||!this.files[0])return;
  var w=works.find(function(x){return x.id===selectedId});if(!w)return;
  var idx=editingBlockIdx;
  resizeImage(this.files[0],function(b64){
    if(idx<w.detail.length&&w.detail[idx].t==='image'){w.detail[idx].src=b64}
    else {w.detail.splice(idx,0,{t:'image',src:b64})}
    renderEditor();save();toast('图片模块已添加 ✓')
  });
  this.value='';
});

function editBlockImg(idx){editingBlockIdx=idx;document.getElementById('blockImgInput').click()}

// Gallery management
document.getElementById('galleryInput').addEventListener('change',function(){
  var w=works.find(function(x){return x.id===selectedId});if(!w)return;
  if(!w.gallery)w.gallery=[];
  var files=this.files;if(!files||files.length===0)return;
  var loaded=0;
  function loadNext(idx){
    if(idx>=files.length){renderEditor();save();toast('已上传 '+loaded+' 张主图');return}
    resizeImage(files[idx],function(b64){w.gallery.push(b64);loaded++;loadNext(idx+1)});
  }
  loadNext(0);this.value='';
});

function setCover(i){
  var w=works.find(function(x){return x.id===selectedId});if(!w||!w.gallery)return;
  var img=w.gallery.splice(i,1)[0];w.gallery.unshift(img);
  w.img=img;renderEditor();save();toast('已设为封面')
}
function removeGalleryImg(i){
  var w=works.find(function(x){return x.id===selectedId});if(!w||!w.gallery)return;
  w.gallery.splice(i,1);if(i===0&&w.gallery.length>0)w.img=w.gallery[0];
  renderEditor();save();
}

function deleteBlock(idx){
  var w=works.find(function(x){return x.id===selectedId});if(!w)return;
  w.detail.splice(idx,1);renderEditor();save();
}

function attachBlockDrag(){
  var items=document.querySelectorAll('.block-item');
  var dragIdx=null;
  items.forEach(function(item){
    item.addEventListener('dragstart',function(e){dragIdx=parseInt(item.dataset.idx);item.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
    item.addEventListener('dragend',function(){item.classList.remove('dragging')});
    item.addEventListener('dragover',function(e){e.preventDefault();e.dataTransfer.dropEffect='move'});
    item.addEventListener('drop',function(e){e.preventDefault();
      var toIdx=parseInt(item.dataset.idx);if(dragIdx===null||dragIdx===toIdx)return;
      var w=works.find(function(x){return x.id===selectedId});if(!w)return;
      var moved=w.detail.splice(dragIdx,1)[0];w.detail.splice(toIdx,0,moved);
      renderEditor();save();
    });
  });
}

// ====== Preview ======
function openPreview(){
  var w=works.find(function(x){return x.id===selectedId});if(!w)return;
  var pc=document.getElementById('previewContent');
  var html='<button class="preview-close" onclick="closePreview()">✕</button>';
  html+='<img class="preview-img" src="'+esc(w.img)+'">';
  html+='<div class="preview-info"><div class="cat">'+esc(w.category)+'</div><h2>'+esc(w.title)+'</h2>';
  var desc='';for(var i=0;i<w.detail.length;i++){if(w.detail[i].t==='text'){desc=w.detail[i].c;break}}
  html+='<p class="desc">'+esc(desc)+'</p></div>';
  html+='<div class="preview-blocks">';
  for(var i=0;i<w.detail.length;i++){
    var b=w.detail[i];
    if(b.t==='image'){
      var src=b.src||w.img;
      html+='<img src="'+esc(src)+'">';
    } else if(b.t==='text'&&b.title){
      html+='<div class="text-block"><h3>'+esc(b.title)+'</h3><p>'+esc(b.c||'')+'</p></div>';
    }
  }
  html+='</div>';
  pc.innerHTML=html;
  document.getElementById('previewModal').classList.add('open');
}
function closePreview(){document.getElementById('previewModal').classList.remove('open')}

// ====== Export / Import / Reset ======
function copyData(){
  save();
  var data=JSON.stringify(works);
  navigator.clipboard.writeText(data).then(function(){
    toast('已复制！粘贴发给助手即可上线 ✓');
  }).catch(function(){
    // Fallback for older browsers
    var ta=document.createElement('textarea');ta.value=data;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    toast('已复制！粘贴发给助手即可上线 ✓');

  });
}

function exportData(){
  var blob=new Blob([JSON.stringify(works,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='portfolio-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('已导出')
}
function importData(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=function(){if(!this.files[0])return;var r=new FileReader();r.onload=function(e){try{var d=JSON.parse(e.target.result);if(!Array.isArray(d))throw new Error('');works=d;selectedId=null;save();renderEditor();toast('已导入 '+d.length+' 件作品')}catch(err){toast('格式错误')}};r.readAsText(this.files[0])};inp.click();
}
// ====== Auto Deploy to GitHub ======
var GITHUB_REPO='ddha6/portfolio';

function deployToGitHub(){
  save();
  var js='var DEFAULT_WORKS='+JSON.stringify(works)+';';
  var content=btoa(unescape(encodeURIComponent(js)));
  // Get current file SHA
  var xhr=new XMLHttpRequest();
  xhr.open('GET','https://api.github.com/repos/'+GITHUB_REPO+'/contents/data.js',true);
  xhr.setRequestHeader('Authorization','token '+GITHUB_TOKEN);
  xhr.setRequestHeader('Accept','application/vnd.github.v3+json');
  xhr.onload=function(){
    if(xhr.status===200||xhr.status===404){
      var sha=null;
      if(xhr.status===200){var r=JSON.parse(xhr.responseText);sha=r.sha}
      // Create/update file
      var body=JSON.stringify({message:'update: data refresh',content:content,branch:'main'});
      if(sha)body=JSON.stringify({message:'update: data refresh',content:content,sha:sha,branch:'main'});
      var put=new XMLHttpRequest();
      put.open('PUT','https://api.github.com/repos/'+GITHUB_REPO+'/contents/data.js',true);
      put.setRequestHeader('Authorization','token '+GITHUB_TOKEN);
      put.setRequestHeader('Accept','application/vnd.github.v3+json');
      put.setRequestHeader('Content-Type','application/json');
      put.onload=function(){
        if(put.status===200||put.status===201){toast('✓ 已发布上线！1分钟后刷新网站查看')}
        else{try{var e=JSON.parse(put.responseText);toast('发布失败: '+e.message)}catch(err){toast('发布失败，请检查网络')}}
      };
      put.send(body);
    }else{toast('网络错误，请重试')}
  };
  xhr.send();
}

function resetAll(){
  if(!confirm('确定恢复默认数据？所有修改将丢失。'))return;
  works=DEFAULT_WORKS.slice();selectedId=null;try{localStorage.removeItem('pf_works')}catch(e){}save();renderEditor();toast('已恢复默认')
}

// ====== Init ======
refreshList();
renderEditor();
</script>
