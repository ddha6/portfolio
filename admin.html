<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品管理后台</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f3f2ef;--glass:rgba(255,255,255,.68);
  --glass-border:rgba(255,255,255,.5);--text:#1d1d1f;
  --text2:#6e6e73;--text3:#aeaeb2;--accent:#0071e3;
  --red:#e53935;--green:#2e7d32;
  --radius:16px;--radius-sm:12px;--radius-xs:8px;
  --shadow:0 8px 32px rgba(0,0,0,.05),0 2px 6px rgba(0,0,0,.03),inset 0 1px 0 rgba(255,255,255,.6);
  --shadow-lg:0 20px 56px rgba(0,0,0,.09),inset 0 1px 0 rgba(255,255,255,.7);
  --ease:cubic-bezier(.16,1,.3,1);
}
html{-webkit-font-smoothing:antialiased}
body{
  font-family:'Inter','Noto Sans SC',system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
  height:100vh;overflow:hidden;
}
::selection{background:rgba(0,113,227,.2)}
/* Canvas */
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.85}
body::after{
  content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:.02;
  background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
/* Layout */
.app{display:flex;height:100vh;position:relative;z-index:1}
/* Sidebar */
.sidebar{
  width:280px;flex-shrink:0;display:flex;flex-direction:column;
  background:rgba(255,255,255,.4);backdrop-filter:blur(30px) saturate(200%);-webkit-backdrop-filter:blur(30px) saturate(200%);
  border-right:1px solid rgba(0,0,0,.06);
}
.sidebar-top{padding:20px 18px 10px}
.sidebar-top h2{font-size:16px;font-weight:600;letter-spacing:-.01em;margin-bottom:2px}
.sidebar-top .meta{font-size:11px;color:var(--text3)}
.sidebar-actions{display:flex;gap:6px;padding:0 18px 12px;flex-wrap:wrap}
.btn{
  font-size:11.5px;font-weight:520;padding:7px 15px;border-radius:100px;border:none;
  cursor:pointer;letter-spacing:.02em;transition:all .25s;
  display:inline-flex;align-items:center;gap:4px;
}
.btn-p{background:var(--accent);color:#fff}
.btn-p:hover{box-shadow:0 4px 14px rgba(0,113,227,.3);transform:translateY(-1px)}
.btn-o{background:rgba(0,0,0,.03);color:var(--text2)}
.btn-o:hover{background:rgba(0,0,0,.06);color:var(--text)}
.btn-r{background:rgba(229,57,53,.08);color:var(--red)}
.btn-r:hover{background:rgba(229,57,53,.15)}
.btn-g{background:var(--red);color:#fff}
.btn-g:hover{box-shadow:0 4px 14px rgba(229,57,53,.3)}

.work-list{flex:1;overflow-y:auto;padding:4px 12px 12px;display:flex;flex-direction:column;gap:3px}
.work-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);
  cursor:pointer;transition:all .2s;
}
.work-item:hover{background:rgba(0,0,0,.03)}
.work-item.active{background:rgba(0,113,227,.07);box-shadow:inset 0 0 0 1px rgba(0,113,227,.12)}
.work-item-thumb{
  width:44px;height:44px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#e8e6e2;
}
.work-item-thumb img{width:100%;height:100%;object-fit:cover}
.work-item-info{flex:1;min-width:0}
.work-item-title{font-size:12.5px;font-weight:530;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.work-item-cat{font-size:10px;color:var(--text3);margin-top:1px}
.work-item-del{
  width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--text3);opacity:0;transition:all .2s;flex-shrink:0;font-size:13px;
}
.work-item:hover .work-item-del{opacity:1}
.work-item-del:hover{color:var(--red);background:rgba(229,57,53,.08)}

/* Editor */
.editor{flex:1;overflow-y:auto;padding:24px 28px}
.editor-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:14px;flex-direction:column;gap:8px}
.editor-grid{display:flex;flex-direction:column;gap:20px;max-width:900px}

.card{
  background:var(--glass);backdrop-filter:blur(28px) saturate(200%);-webkit-backdrop-filter:blur(28px) saturate(200%);
  border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);
}
.card::after{content:'';position:absolute;top:0;left:18px;right:18px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);pointer-events:none}
.card h3{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin-bottom:14px}
.form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.form-row:last-child{margin-bottom:0}
.fg{flex:1;min-width:140px}
.fg label{display:block;font-size:10px;font-weight:550;color:var(--text3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.fg input,.fg select,.fg textarea{
  width:100%;font-family:inherit;font-size:12.5px;padding:8px 12px;
  border:1px solid rgba(0,0,0,.08);border-radius:10px;
  background:rgba(255,255,255,.5);outline:none;transition:border .2s;
  color:var(--text);
}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent)}
.fg textarea{resize:vertical;min-height:56px;line-height:1.6}
.thumb-zone{
  width:140px;height:105px;border-radius:12px;overflow:hidden;
  background:#e8e6e2;cursor:pointer;border:2px dashed rgba(0,0,0,.1);
  display:flex;align-items:center;justify-content:center;transition:all .2s;
  position:relative;
}
.thumb-zone:hover{border-color:var(--accent);background:rgba(0,113,227,.02)}
.thumb-zone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb-zone .ph{font-size:11px;color:var(--text3);text-align:center;line-height:1.4}

/* Gallery strip */
.gallery-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory}
.gallery-item{
  flex-shrink:0;width:80px;height:80px;border-radius:10px;overflow:hidden;
  border:2px solid rgba(0,0,0,.06);cursor:pointer;position:relative;scroll-snap-align:start;
  transition:border .2s;
}
.gallery-item:hover{border-color:var(--accent)}
.gallery-item.cover{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,113,227,.2)}
.gallery-item img{width:100%;height:100%;object-fit:cover}
.gallery-item .label{
  position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.5);
  color:#fff;font-size:9px;text-align:center;padding:2px 0;
}
.gallery-item.cover .label{background:var(--accent);font-weight:600}
.gallery-item .del{
  position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;
  background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:9px;cursor:pointer;opacity:0;transition:opacity .2s;
}
.gallery-item:hover .del{opacity:1}

/* Blocks */
.block-list{display:flex;flex-direction:column;gap:6px}
.block-row{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-radius:10px;background:rgba(0,0,0,.015);border:1px solid rgba(0,0,0,.04);
  transition:all .2s;
}
.block-row:hover{border-color:rgba(0,0,0,.1)}
.block-row.dragging{opacity:.4}
.block-handle{cursor:grab;color:var(--text3);font-size:14px;letter-spacing:-2px;flex-shrink:0}
.block-tag{
  font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  padding:3px 8px;border-radius:6px;flex-shrink:0;
}
.block-tag.img{background:rgba(0,113,227,.08);color:var(--accent)}
.block-tag.txt{background:rgba(46,125,50,.1);color:var(--green)}
.block-preview{flex:1;min-width:0;font-size:11.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.block-preview img{width:50px;height:38px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:6px}
.block-del{
  width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--text3);cursor:pointer;transition:all .2s;flex-shrink:0;font-size:12px;
}
.block-del:hover{color:var(--red);background:rgba(229,57,53,.08)}
.block-add{display:flex;gap:6px;margin-top:6px}

/* Preview */
.preview-overlay{
  position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  visibility:hidden;opacity:0;transition:all .3s;
}
.preview-overlay.open{visibility:visible;opacity:1}
.preview-panel{
  width:380px;max-height:85vh;overflow-y:auto;background:var(--bg);border-radius:var(--radius);
  box-shadow:0 24px 64px rgba(0,0,0,.2);
}
.preview-close{
  position:sticky;top:0;float:right;margin:10px;width:30px;height:30px;border-radius:50%;
  background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:14px;border:none;z-index:2;
}
.preview-hero{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.preview-info{padding:18px 20px}
.preview-info .cat{font-size:10px;color:var(--accent);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.preview-info h4{font-size:15px;font-weight:550;margin-bottom:4px}
.preview-info .price{font-size:18px;font-weight:700;color:var(--red);margin-bottom:8px}
.preview-info .desc{font-size:12px;color:var(--text2);line-height:1.7}
.preview-blocks img{width:100%;display:block}
.preview-blocks .t{font-size:15px;font-weight:520;margin-bottom:6px}
.preview-blocks .p{font-size:12px;color:var(--text2);line-height:1.7}

.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:9999;
  padding:10px 24px;border-radius:100px;font-size:12.5px;font-weight:500;
  background:var(--text);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.2);
  opacity:0;transition:opacity .3s;white-space:nowrap;
}
.toast.show{opacity:1}

@media(max-width:768px){
  .app{flex-direction:column}
  .sidebar{width:100%;max-height:38vh}
  .editor{padding:14px}
  .form-row{flex-direction:column}
  .card{padding:16px}
}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="app">
<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-top">
    <h2>作品管理</h2>
    <span class="meta" id="workCount">0 件作品</span>
  </div>
  <div class="sidebar-actions">
    <button class="btn btn-p" onclick="addWork()">+ 新建</button>
    <button class="btn btn-o" onclick="exportData()">导出</button>
    <button class="btn btn-o" onclick="importData()">导入</button>
    <button class="btn btn-r" onclick="resetAll()">重置</button>
  </div>
  <div class="work-list" id="workList"></div>
</div>
<!-- Editor -->
<div class="editor" id="editor"></div>
</div>
<!-- Preview -->
<div class="preview-overlay" id="previewOverlay" onclick="if(event.target===this)closePreview()">
  <div class="preview-panel" id="previewPanel"></div>
</div>
<!-- Toast -->
<div class="toast" id="toast"></div>
<!-- Hidden inputs -->
<input type="file" id="thumbInput" accept="image/*" style="display:none">
<input type="file" id="galleryInput" accept="image/*" multiple style="display:none">
<input type="file" id="blockImgInput" accept="image/*" style="display:none">

<script>document.write('<scr'+'ipt src="data.js?v='+Date.now()+'"></scr'+'ipt>')</script>
<script src="token.js"></script>
<script>
// ====== Canvas Background ======
(function(){
  var c=document.getElementById('bgCanvas'),x=c.getContext('2d'),W,H,ps,rs;
  function rz(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
  function mk(){
    var pc=Math.floor(W*H/18000);ps=[];
    var cs=['rgba(0,113,227,','rgba(120,105,220,','rgba(180,155,130,','rgba(100,165,210,','rgba(165,140,185,)'];
    for(var i=0;i<pc;i++)ps.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*2+1,cl:cs[Math.floor(Math.random()*cs.length)],a:Math.random()*.35+.05,pl:Math.random()*Math.PI*2});
    rs=[];var rc=Math.floor(W*H/250000);
    for(var i=0;i<rc;i++)rs.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*50+25,vx:(Math.random()-.5)*.1,vy:(Math.random()-.5)*.1,a:Math.random()*.05+.01,rot:Math.random()*Math.PI*2,rv:(Math.random()-.5)*.002});
  }
  function dr(){
    x.clearRect(0,0,W,H);
    for(var i=0;i<ps.length;i++){var p=ps[i];p.x+=p.vx;p.y+=p.vy;if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;p.pl+=.008;var aa=p.a*(1+Math.sin(p.pl)*.2);var g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);g.addColorStop(0,p.cl+(aa*1.2)+')');g.addColorStop(.5,p.cl+(aa*.4)+')');g.addColorStop(1,p.cl+'0)');x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r*3,0,Math.PI*2);x.fill();x.fillStyle=p.cl+aa+')';x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill()}
    x.lineWidth=.3;for(var i=0;i<ps.length;i++)for(var j=i+1;j<ps.length;j++){var dx=ps[i].x-ps[j].x,dy=ps[i].y-ps[j].y,dt=Math.sqrt(dx*dx+dy*dy);if(dt<120){x.strokeStyle='rgba(0,0,0,'+(.022*(1-dt/120))+')';x.beginPath();x.moveTo(ps[i].x,ps[i].y);x.lineTo(ps[j].x,ps[j].y);x.stroke()}}
    for(var i=0;i<rs.length;i++){var r=rs[i];r.x+=r.vx;r.y+=r.vy;r.rot+=r.rv;if(r.x<-60)r.x=W+60;if(r.x>W+60)r.x=-60;if(r.y<-60)r.y=H+60;if(r.y>H+60)r.y=-60;x.save();x.translate(r.x,r.y);x.rotate(r.rot);x.strokeStyle='rgba(0,0,0,'+r.a+')';x.lineWidth=.5;x.beginPath();x.ellipse(0,0,r.r,r.r*.55,0,0,Math.PI*2);x.stroke();x.restore()}
    requestAnimationFrame(dr);
  }
  window.addEventListener('resize',function(){rz();mk()});rz();mk();dr();
})();

// ====== Data ======
var works=[];try{var d=localStorage.getItem('pf_works');works=d?JSON.parse(d):DEFAULT_WORKS}catch(e){works=DEFAULT_WORKS}
var selectedId=null,editingBlockIdx=null,toastTimer;

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},2000)}
function save(){try{localStorage.setItem('pf_works',JSON.stringify(works));toast('已保存 ✓')}catch(e){toast('保存失败')};refreshList()}
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

// ====== Sidebar ======
function refreshList(){
  var l=document.getElementById('workList');
  document.getElementById('workCount').textContent=works.length+' 件作品';
  l.innerHTML=works.map(function(w){
    var a=selectedId===w.id?' active':'';
    var img=w.img||'';
    return'<div class="work-item'+a+'" onclick="selectWork('+w.id+')">'+
      '<div class="work-item-thumb">'+(img?'<img src="'+esc(img)+'" onerror="this.style.display=\'none\'">':'')+'</div>'+
      '<div class="work-item-info"><div class="work-item-title">'+esc(w.title||'未命名')+'</div><div class="work-item-cat">'+esc(w.category||'')+(w.price?' · ¥'+esc(w.price):'')+'</div></div>'+
      '<div class="work-item-del" onclick="event.stopPropagation();deleteWork('+w.id+')" title="删除">×</div>'+
    '</div>';
  }).join('');
}

function selectWork(id){selectedId=id;refreshList();renderEditor()}
function addWork(){
  var maxId=0;works.forEach(function(w){if(w.id>maxId)maxId=w.id});
  works.unshift({id:maxId+1,title:'新作品',category:'电商设计',client:'',price:'',img:'',detail:[],gallery:[],specs:{}});
  save();selectedId=works[0].id;refreshList();renderEditor();toast('已创建')
}
function deleteWork(id){
  if(!confirm('删除？'))return;
  works=works.filter(function(w){return w.id!==id});
  if(selectedId===id)selectedId=null;save();renderEditor();
}

// ====== Editor ======
function renderEditor(){
  var ed=document.getElementById('editor');if(!selectedId){ed.innerHTML='<div class="editor-empty"><div>← 选择作品开始编辑</div><div style="font-size:12px;color:var(--text3)">或点击「+ 新建」</div></div>';return}
  var w=works.find(function(x){return x.id===selectedId});if(!w)return;
  if(!w.detail)w.detail=[];if(!w.gallery)w.gallery=[];if(!w.specs)w.specs={};
  // Gallery
  var gHtml='';
  if(w.gallery.length>0){
    gHtml=w.gallery.map(function(s,i){
      return'<div class="gallery-item'+(i===0?' cover':'')+'" onclick="setCover('+i+')" title="'+(i===0?'封面':'设为封面')+'">'+
        '<img src="'+esc(s)+'"><div class="label">'+(i===0?'★ 封面':'')+'</div>'+
        '<div class="del" onclick="event.stopPropagation();removeGallery('+i+')">×</div></div>';
    }).join('');
  }else{gHtml='<span style="font-size:11px;color:var(--text3)">暂无，请上传</span>'}
  // Detail blocks
  var blHtml='';
  w.detail.forEach(function(b,i){
    if(b.t==='image'){
      blHtml+='<div class="block-row" draggable="true" data-idx="'+i+'">'+
        '<div class="block-handle">⋮⋮</div><span class="block-tag img">图片</span>'+
        '<div class="block-preview" onclick="event.stopPropagation();editBlockImg('+i+')" title="点击替换">'+(b.src?('<img src="'+esc(b.src)+'">'):'点击上传图片')+'</div>'+
        '<div class="block-del" onclick="deleteBlock('+i+')">×</div></div>';
    }else{
      var t=b.c||'';if(t.length>25)t=t.substring(0,25)+'…';
      blHtml+='<div class="block-row" draggable="true" data-idx="'+i+'">'+
        '<div class="block-handle">⋮⋮</div><span class="block-tag txt">文字</span>'+
        '<div class="block-preview"><b>'+esc(b.title||'')+'</b> '+esc(t)+'</div>'+
        '<div class="block-del" onclick="deleteBlock('+i+')">×</div></div>';
    }
  });
  if(!blHtml)blHtml='<span style="font-size:11px;color:var(--text3)">暂无详情模块，点击下方添加</span>';

  ed.innerHTML='<div class="editor-grid">'+
    '<div class="card"><h3>基本信息</h3>'+
      '<div class="form-row">'+
        '<div class="fg" style="flex:2"><label>作品名称</label><input value="'+esc(w.title||'')+'" id="edTitle"></div>'+
        '<div class="fg"><label>分类</label><select id="edCat"><option value="电商设计"'+(w.category==='电商设计'?' selected':'')+'>电商设计</option><option value="海报设计"'+(w.category==='海报设计'?' selected':'')+'>海报设计</option></select></div>'+
        '<div class="fg"><label>价格</label><input value="'+esc(w.price||'')+'" id="edPrice" placeholder="如 299"></div>'+
      '</div>'+
      '<div class="form-row">'+
        '<div class="fg"><label>客户</label><input value="'+esc(w.client||'')+'" id="edClient"></div>'+
        '<div class="fg"><label>封面缩略图</label>'+
          '<div class="thumb-zone" id="thumbZone" onclick="document.getElementById(\'thumbInput\').click()">'+
            (w.img?'<img src="'+esc(w.img)+'">':'<span class="ph">点击上传<br>或拖拽</span>')+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="card"><h3>主图集（轮播）</h3>'+
      '<div class="gallery-strip" id="galleryStrip">'+gHtml+'</div>'+
      '<button class="btn btn-o" style="margin-top:6px" onclick="document.getElementById(\'galleryInput\').click()">+ 上传主图</button>'+
      '<span style="font-size:10px;color:var(--text3);margin-left:8px">首张为封面，点击设封面</span>'+
    '</div>'+
    '<div class="card"><h3>详情模块（下滑长图）</h3>'+
      '<div class="block-list" id="blockList">'+blHtml+'</div>'+
      '<div class="block-add">'+
        '<button class="btn btn-o" onclick="addBlock(\'image\')">+ 图片</button>'+
        '<button class="btn btn-o" onclick="addBlock(\'text\')">+ 文字</button>'+
      '</div>'+
    '</div>'+
    '<div style="display:flex;gap:8px">'+
      '<button class="btn btn-p" onclick="saveEditor()">保存</button>'+
      '<button class="btn btn-g" onclick="deployToGitHub()">🚀 上线</button>'+
      '<button class="btn btn-o" onclick="openPreview()">预览</button>'+
    '</div>'+
  '</div>';
  attachDrag();setupThumb();
}

function saveEditor(){
  var w=works.find(function(x){return x.id===selectedId});if(!w)return;
  w.title=document.getElementById('edTitle').value||'未命名';
  w.category=document.getElementById('edCat').value;
  w.client=document.getElementById('edClient').value;
  w.price=document.getElementById('edPrice').value;
  save();renderEditor();toast('已保存 ✓')
}

// ====== Image Upload ======
document.getElementById('thumbInput').addEventListener('change',function(){
  if(!this.files||!this.files[0])return;
  resizeImage(this.files[0],function(b64){
    var w=works.find(function(x){return x.id===selectedId});if(!w)return;
    w.img=b64;renderEditor();save();toast('封面已更新')
  });this.value='';
});
document.getElementById('galleryInput').addEventListener('change',function(){
  var w=works.find(function(x){return x.id===selectedId});if(!w)return;
  if(!w.gallery)w.gallery=[];
  var files=this.files,loaded=0;
  function next(i){if(i>=files.length){renderEditor();save();toast('已上传 '+loaded+' 张');return}
    resizeImage(files[i],function(b64){w.gallery.push(b64);if(w.gallery.length===1)w.img=b64;loaded++;next(i+1)});}
  next(0);this.value='';
});
document.getElementById('blockImgInput').addEventListener('change',function(){
  if(!this.files||!this.files[0])return;
  resizeImage(this.files[0],function(b64){
    var w=works.find(function(x){return x.id===selectedId});if(!w)return;
    if(editingBlockIdx!==null&&editingBlockIdx<w.detail.length&&w.detail[editingBlockIdx].t==='image'){w.detail[editingBlockIdx].src=b64}
    else{w.detail.splice(editingBlockIdx!==null?editingBlockIdx:w.detail.length,0,{t:'image',src:b64})}
    renderEditor();save();toast('详情图已添加')
  });this.value='';
});

function resizeImage(file,cb){
  var reader=new FileReader();reader.onload=function(e){
    var img=new Image();img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,max=1200;
      if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}
      var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',.85));
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}
function setupThumb(){
  var el=document.getElementById('thumbZone');if(!el)return;
  el.addEventListener('dragover',function(e){e.preventDefault();el.style.borderColor='var(--accent)'});
  el.addEventListener('dragleave',function(){el.style.borderColor=''});
  el.addEventListener('drop',function(e){e.preventDefault();el.style.borderColor='';
    if(!e.dataTransfer.files[0])return;
    resizeImage(e.dataTransfer.files[0],function(b64){
      var w=works.find(function(x){return x.id===selectedId});if(!w)return;
      w.img=b64;renderEditor();save();toast('封面已更新')
    });
  });
}

// ====== Gallery ======
function setCover(i){
  var w=works.find(function(x){return x.id===selectedId});if(!w||!w.gallery)return;
  var img=w.gallery.splice(i,1)[0];w.gallery.unshift(img);w.img=img;renderEditor();save();toast('已设为封面')
}
function removeGallery(i){
  var w=works.find(function(x){return x.id===selectedId});if(!w||!w.gallery)return;
  w.gallery.splice(i,1);if(i===0&&w.gallery.length>0)w.img=w.gallery[0];renderEditor();save();
}

// ====== Blocks ======
function addBlock(type){
  var w=works.find(function(x){return x.id===selectedId});if(!w)return;
  if(type==='image'){editingBlockIdx=w.detail.length;document.getElementById('blockImgInput').click()}
  else{w.detail.push({t:'text',title:'新段落',c:''});renderEditor();save()}
}
function editBlockImg(i){editingBlockIdx=i;document.getElementById('blockImgInput').click()}
function deleteBlock(i){var w=works.find(function(x){return x.id===selectedId});if(!w)return;w.detail.splice(i,1);renderEditor();save()}
function attachDrag(){
  var items=document.querySelectorAll('.block-row');var dragIdx=null;
  items.forEach(function(item){
    item.addEventListener('dragstart',function(e){dragIdx=parseInt(item.dataset.idx);item.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
    item.addEventListener('dragend',function(){item.classList.remove('dragging')});
    item.addEventListener('dragover',function(e){e.preventDefault();e.dataTransfer.dropEffect='move'});
    item.addEventListener('drop',function(e){e.preventDefault();
      var toIdx=parseInt(item.dataset.idx);if(dragIdx===null||dragIdx===toIdx)return;
      var w=works.find(function(x){return x.id===selectedId});if(!w)return;
      var moved=w.detail.splice(dragIdx,1)[0];w.detail.splice(toIdx,0,moved);renderEditor();save();
    });
  });
}

// ====== Preview ======
function openPreview(){
  var w=works.find(function(x){return x.id===selectedId});if(!w)return;
  var p=document.getElementById('previewPanel');
  var h='<button class="preview-close" onclick="closePreview()">×</button>';
  var img=w.img;if(w.gallery&&w.gallery.length>0)img=w.gallery[0];
  h+='<img class="preview-hero" src="'+esc(img)+'">';
  h+='<div class="preview-info"><div class="cat">'+esc(w.category||'')+'</div><h4>'+esc(w.title||'')+'</h4>';
  if(w.price)h+='<div class="price">¥'+esc(w.price)+'</div>';
  var desc='';for(var i=0;i<w.detail.length;i++){if(w.detail[i].t==='text'){desc=w.detail[i].c;break}}
  h+='<p class="desc">'+esc(desc)+'</p></div>';
  if(w.detail.length>0){
    h+='<div class="preview-blocks">';
    for(var i=0;i<w.detail.length;i++){
      var b=w.detail[i];
      if(b.t==='image')h+='<img src="'+esc(b.src||img)+'">';
      else if(b.t==='text'&&b.title)h+='<div style="padding:16px 20px"><div class="t">'+esc(b.title)+'</div><div class="p">'+esc(b.c||'')+'</div></div>';
    }
    h+='</div>';
  }
  p.innerHTML=h;document.getElementById('previewOverlay').classList.add('open');
}
function closePreview(){document.getElementById('previewOverlay').classList.remove('open')}

// ====== Deploy ======
function deployToGitHub(){
  save();
  if(typeof GITHUB_TOKEN==='undefined'){toast('token.js 缺失');return}
  var js='var DEFAULT_WORKS='+JSON.stringify(works)+';';
  var encoder=new TextEncoder();var bytes=encoder.encode(js);
  var bin='';for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  var content=btoa(bin);
  var xhr=new XMLHttpRequest();
  xhr.open('GET','https://api.github.com/repos/ddha6/portfolio/contents/data.js',true);
  xhr.setRequestHeader('Authorization','token '+GITHUB_TOKEN);
  xhr.setRequestHeader('Accept','application/vnd.github.v3+json');
  xhr.onload=function(){
    if(xhr.status===200||xhr.status===404){
      var sha=null;if(xhr.status===200)sha=JSON.parse(xhr.responseText).sha;
      var body=JSON.stringify({message:'update data',content:content,branch:'main'});
      if(sha)body=JSON.stringify({message:'update data',content:content,sha:sha,branch:'main'});
      var put=new XMLHttpRequest();
      put.open('PUT','https://api.github.com/repos/ddha6/portfolio/contents/data.js',true);
      put.setRequestHeader('Authorization','token '+GITHUB_TOKEN);
      put.setRequestHeader('Accept','application/vnd.github.v3+json');
      put.setRequestHeader('Content-Type','application/json');
      put.onload=function(){if(put.status===200||put.status===201)toast('✓ 已上线！');else toast('失败: '+put.status)};
      put.send(body);
    }else toast('网络错误')
  };
  xhr.send();
}

// ====== Export / Import / Reset ======
function exportData(){
  var blob=new Blob([JSON.stringify(works,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='portfolio-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('已导出')
}
function importData(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=function(){if(!this.files[0])return;var r=new FileReader();r.onload=function(e){try{var d=JSON.parse(e.target.result);if(!Array.isArray(d))throw new Error('');works=d;selectedId=null;save();renderEditor();toast('已导入 '+d.length+' 件')}catch(err){toast('格式错误')}};r.readAsText(this.files[0])};inp.click();
}
function resetAll(){
  if(!confirm('确定恢复默认数据？'))return;
  works=DEFAULT_WORKS.slice();selectedId=null;try{localStorage.removeItem('pf_works')}catch(e){}save();renderEditor();toast('已重置')
}

// ====== Init ======
refreshList();renderEditor();
</script>
