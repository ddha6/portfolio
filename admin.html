<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品管理后台</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f3f2ef;--card:rgba(255,255,255,.72);--text:#1d1d1f;
  --text2:#6e6e73;--text3:#aeaeb2;--accent:#0071e3;
  --glass-border:rgba(255,255,255,.55);--radius:18px;--radius-sm:14px;
  --shadow:0 8px 32px rgba(0,0,0,.05),0 2px 6px rgba(0,0,0,.03),inset 0 1px 0 rgba(255,255,255,.6);
  --shadow-lg:0 20px 56px rgba(0,0,0,.09),0 4px 12px rgba(0,0,0,.04),inset 0 1px 0 rgba(255,255,255,.7);
}
html{-webkit-font-smoothing:antialiased}
body{
  font-family:'Inter','Noto Sans SC',system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
}
.app{max-width:1200px;margin:0 auto;padding:32px 24px 64px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.header h1{font-size:22px;font-weight:550;letter-spacing:-.02em}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  font-size:13px;font-weight:500;padding:9px 20px;border-radius:100px;border:1px solid var(--glass-border);
  cursor:pointer;letter-spacing:.02em;transition:all .3s;
  background:var(--card);backdrop-filter:blur(28px) saturate(200%);-webkit-backdrop-filter:blur(28px) saturate(200%);
  color:var(--text2);box-shadow:var(--shadow);
}
.btn:hover{color:var(--text);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{box-shadow:0 4px 20px rgba(0,113,227,.3)}
.btn-danger:hover{color:#d32f2f}
.msg{font-size:12px;color:var(--text3)}
.msg.ok{color:#2e7d32}
.hint-text{font-size:12px;color:var(--text3);margin-bottom:20px;line-height:1.6}

.works-list{display:flex;flex-direction:column;gap:12px}
.work-card{
  display:grid;grid-template-columns:110px 300px 180px 90px 48px;gap:16px;
  align-items:center;padding:14px 18px;border-radius:var(--radius);
  background:var(--card);backdrop-filter:blur(28px) saturate(200%);-webkit-backdrop-filter:blur(28px) saturate(200%);
  border:1px solid var(--glass-border);box-shadow:var(--shadow);
  transition:box-shadow .35s,transform .35s,opacity .35s,border-color .25s;
  cursor:grab;position:relative;overflow:hidden;
}
.work-card::after{
  content:'';position:absolute;top:0;left:18px;right:18px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);pointer-events:none;
}
.work-card:hover{border-color:rgba(0,0,0,.12);box-shadow:var(--shadow-lg)}
.work-card:active{cursor:grabbing}
.work-card.dragging{opacity:.4;transform:scale(.98)}
.work-card.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,113,227,.15)}

.card-preview{
  width:100px;height:100px;border-radius:var(--radius-sm);overflow:hidden;
  background:#e8e6e2;cursor:pointer;position:relative;flex-shrink:0;
}
.card-preview img{width:100%;height:100%;object-fit:cover}
.card-preview .hint{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.45);color:#fff;font-size:12px;font-weight:500;
  opacity:0;transition:opacity .25s;border-radius:var(--radius-sm);
}
.card-preview:hover .hint{opacity:1}
.card-fields{display:flex;flex-direction:column;gap:6px}
.card-fields input,.card-fields textarea{
  font-family:inherit;font-size:12px;padding:8px 12px;
  border:1px solid rgba(0,0,0,.08);border-radius:10px;
  background:rgba(255,255,255,.5);outline:none;transition:border .25s;
}
.card-fields input:focus,.card-fields textarea:focus{border-color:var(--accent)}
.card-fields input.title{font-weight:550;font-size:13px}
.card-fields textarea.desc{min-height:52px;resize:vertical;font-size:11px;color:var(--text2);line-height:1.6}
.card-meta{display:flex;flex-direction:column;gap:6px}
.card-meta input{
  font-family:inherit;font-size:11px;padding:7px 10px;
  border:1px solid rgba(0,0,0,.08);border-radius:10px;
  background:rgba(255,255,255,.5);outline:none;transition:border .25s;
  color:var(--text2);
}
.card-meta input:focus{border-color:var(--accent)}
.card-img-path{font-size:10px;color:var(--text3);word-break:break-all;line-height:1.4}
.card-cat{font-size:11px;font-weight:500;padding:4px 10px;border-radius:100px;background:rgba(0,0,0,.04);color:var(--text2);text-align:center}
.card-drag-handle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:color .2s;flex-shrink:0}
.card-drag-handle svg{width:18px;height:18px}
.work-card:hover .card-drag-handle{color:var(--text2)}
.hidden-file{display:none}

@media(max-width:900px){
  .work-card{grid-template-columns:80px 1fr;gap:10px;padding:12px}
  .card-preview{width:70px;height:70px}
  .card-meta,.card-cat,.card-drag-handle{display:none}
}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>作品管理后台</h1>
    <div class="actions">
      <button class="btn btn-primary" id="btnSave">保存并同步</button>
      <button class="btn" id="btnExport">导出备份</button>
      <button class="btn" id="btnImport">导入备份</button>
      <button class="btn btn-danger" id="btnReset">恢复默认</button>

    </div>
  </div>
  <p class="hint-text">拖拽卡片右侧手柄进行排序 · 点击图片上传替换 · 修改信息后点击「保存并同步」</p>
  <div class="works-list" id="worksList"></div>
  <input type="file" class="hidden-file" id="hiddenFileInput" accept="image/*">
</div>

<script>

  {id:13,title:'蔚来 · 新车发布海报',category:'海报设计',client:'蔚来汽车',year:'2024',img:defImg('海报设计',0),detail:[{t:'image'},{t:'text',title:'项目背景',c:'蔚来新款车型发布预热海报系列，需要在发布前通过视觉逐步揭开新车面纱，制造期待感。'}],specs:{'项目类型':'海报设计','客户':'蔚来汽车','年份':'2024','服务内容':'预热海报 / 发布主视觉 / 社交媒体物料'}}
]}

// Load from localStorage or use default
var works;
try{var d=localStorage.getItem('pf_works');works=d?JSON.parse(d):getDefaultWorks()}catch(e){works=getDefaultWorks()}

var editingImgId=null;
var list=document.getElementById('worksList');
var msgEl=document.getElementById('msg');
var fileInput=document.getElementById('hiddenFileInput');

function showMsg(t,ok){msgEl.textContent=t;msgEl.className='msg'+(ok?' ok':'');setTimeout(function(){msgEl.textContent=''},3000)}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ====== Render ======
function render(){
  list.innerHTML='';
  for(var i=0;i<works.length;i++){
    var w=works[i];
    var desc='';
    if(w.detail)for(var j=0;j<w.detail.length;j++){if(w.detail[j].t==='text'){desc=w.detail[j].c;break}}
    var div=document.createElement('div');
    div.className='work-card';
    div.draggable=true;
    div.setAttribute('data-id',w.id);
    div.setAttribute('data-index',i);
    div.innerHTML=
      '<div class="card-preview" onclick="triggerUpload('+w.id+')" title="点击更换图片">'+
        '<img src="'+esc(w.img)+'" alt="" onerror="this.style.display=\'none\'">'+
        '<div class="hint">点击换图</div>'+
      '</div>'+
      '<div class="card-fields">'+
        '<input class="title" value="'+esc(w.title)+'" data-id="'+w.id+'" data-field="title" placeholder="作品名称">'+
        '<textarea class="desc" data-id="'+w.id+'" data-field="desc" placeholder="项目描述">'+esc(desc)+'</textarea>'+
      '</div>'+
      '<div class="card-meta">'+
        '<input value="'+esc(w.client||'')+'" data-id="'+w.id+'" data-field="client" placeholder="客户">'+
        '<input value="'+esc(w.year||'')+'" data-id="'+w.id+'" data-field="year" placeholder="年份">'+
        '<span class="card-img-path">'+(w.img.length>45?esc(w.img.substring(0,43))+'…':esc(w.img))+'</span>'+
      '</div>'+
      '<span class="card-cat">'+esc(w.category)+'</span>'+
      '<div class="card-drag-handle" title="拖拽排序">'+
        '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="5" r="1.5"/><circle cx="15" cy="5" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="15" cy="19" r="1.5"/></svg>'+
      '</div>';
    list.appendChild(div);
  }
  attachDrag();
}

// ====== Drag & Drop ======
function attachDrag(){
  var cards=list.querySelectorAll('.work-card');
  cards.forEach(function(card){
    card.addEventListener('dragstart',function(e){
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',card.getAttribute('data-index'));
    });
    card.addEventListener('dragend',function(){card.classList.remove('dragging');cards.forEach(function(c){c.classList.remove('drag-over')})});
    card.addEventListener('dragover',function(e){e.preventDefault();e.dataTransfer.dropEffect='move';card.classList.add('drag-over')});
    card.addEventListener('dragleave',function(){card.classList.remove('drag-over')});
    card.addEventListener('drop',function(e){
      e.preventDefault();card.classList.remove('drag-over');
      var from=parseInt(e.dataTransfer.getData('text/plain'));
      var to=parseInt(card.getAttribute('data-index'));
      if(from===to)return;
      var moved=works.splice(from,1)[0];
      works.splice(to,0,moved);
      render();
      showMsg('排序已调整，请点击保存',true);
    });
  });
}

// ====== Image Upload ======
function triggerUpload(id){editingImgId=id;fileInput.click()}
fileInput.addEventListener('change',function(){
  if(!this.files||!this.files[0])return;
  var file=this.files[0];
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight;
      var max=1200;
      if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}
      var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      var b64=canvas.toDataURL('image/jpeg',0.85);
      for(var i=0;i<works.length;i++){if(works[i].id===editingImgId){works[i].img=b64;break}}
      render();
      showMsg('图片已更新 ('+w+'×'+h+') ✓',true);
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
  this.value='';
});

// ====== Save ======
function save(){
  var cards=list.querySelectorAll('.work-card');
  cards.forEach(function(card){
    var id=parseInt(card.getAttribute('data-id'));
    var w=null;for(var i=0;i<works.length;i++){if(works[i].id===id){w=works[i];break}}
    if(!w)return;
    var inputs=card.querySelectorAll('[data-field]');
    inputs.forEach(function(inp){
      var f=inp.getAttribute('data-field');
      if(f==='title')w.title=inp.value;
      else if(f==='client'){w.client=inp.value;if(w.specs)w.specs['客户']=inp.value}
      else if(f==='year'){w.year=inp.value;if(w.specs)w.specs['年份']=inp.value}
      else if(f==='desc'){if(w.detail)for(var j=0;j<w.detail.length;j++){if(w.detail[j].t==='text'){w.detail[j].c=inp.value;break}}}
    });
  });
  try{localStorage.setItem('pf_works',JSON.stringify(works));showMsg('已保存并同步到网站 ✓',true)}catch(e){showMsg('保存失败：'+e.message,false)}
}

// ====== Export / Import / Reset ======
document.getElementById('btnSave').addEventListener('click',save);
document.getElementById('btnExport').addEventListener('click',function(){
  var blob=new Blob([JSON.stringify(works,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='portfolio-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  showMsg('数据已导出',true);
});
document.getElementById('btnImport').addEventListener('click',function(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=function(){if(!this.files[0])return;var r=new FileReader();r.onload=function(e){try{var d=JSON.parse(e.target.result);if(!Array.isArray(d))throw new Error('格式错误');works=d;render();showMsg('已导入（'+d.length+'件），请点击保存',true)}catch(err){showMsg('导入失败',false)}};r.readAsText(this.files[0])};inp.click();
});
document.getElementById('btnReset').addEventListener('click',function(){
  if(!confirm('确定恢复默认数据？所有修改将丢失。'))return;
  works=getDefaultWorks();try{localStorage.removeItem('pf_works')}catch(e){}render();showMsg('已恢复默认',true);
});

// ====== Init ======
render();
</script>
</body>
</html>
