<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TFR · 作品集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;450;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================
   Reset & Design Tokens — Liquid Glass System
   ============================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f5;
  --glass-strong:rgba(255,255,255,.72);
  --glass-mid:rgba(255,255,255,.58);
  --glass-light:rgba(255,255,255,.44);
  --glass-border:rgba(255,255,255,.55);
  --glass-border-strong:rgba(255,255,255,.8);
  --glass-shadow:0 8px 32px rgba(0,0,0,.05),0 2px 6px rgba(0,0,0,.03),inset 0 1px 0 rgba(255,255,255,.6);
  --glass-shadow-lg:0 20px 56px rgba(0,0,0,.09),0 4px 12px rgba(0,0,0,.04),inset 0 1px 0 rgba(255,255,255,.7);
  --text:#1d1d1f;
  --text-secondary:#6e6e73;
  --text-tertiary:#aeaeb2;
  --accent:#0071e3;
  --accent-glow:rgba(0,113,227,.25);
  --blur-heavy:blur(28px) saturate(200%);
  --blur-mid:blur(18px) saturate(180%);
  --blur-light:blur(10px) saturate(160%);
  --radius-sm:14px;
  --radius:18px;
  --radius-lg:28px;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;zoom:1.2}
body{
  font-family:'Inter','Noto Sans SC',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  line-height:1.6;overflow-x:hidden;
}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}

/* ============================================
   Canvas Particle Background
   ============================================ */
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.9}
body::after{
  content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:.02;
  background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ============================================
   Shared Glass Mixin (via class)
   ============================================ */
.glass-card{
  background:var(--glass-strong);backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);
  border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);
  border-radius:var(--radius-lg);position:relative;overflow:hidden;
}
.glass-card::after{
  content:'';position:absolute;top:0;left:12px;right:12px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
  pointer-events:none;z-index:2;border-radius:1px;
}
.glass-pill{
  background:var(--glass-mid);backdrop-filter:var(--blur-mid);-webkit-backdrop-filter:var(--blur-mid);
  border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);
  border-radius:100px;position:relative;overflow:hidden;
}
.glass-pill::after{
  content:'';position:absolute;top:0;left:20px;right:20px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  pointer-events:none;z-index:2;
}

/* ============================================
   Navigation — Floating Glass Pill
   ============================================ */
.nav{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:100;
  width:calc(100% - 48px);max-width:1400px;
  padding:0 28px;height:54px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.72);backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);
  border:1px solid var(--glass-border-strong);border-radius:100px;
  box-shadow:var(--glass-shadow-lg);
  transition:transform .45s var(--ease-out),box-shadow .4s,background .3s,backdrop-filter .3s;
}
.nav::after{
  content:'';position:absolute;top:0;left:30px;right:30px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  pointer-events:none;z-index:2;
}
.nav.hidden{transform:translateX(-50%) translateY(-130%)}
.nav-brand{font-size:18px;font-weight:600;letter-spacing:-.02em;position:relative;z-index:1}
.nav-links{display:flex;gap:6px;list-style:none;position:relative;z-index:1}
.nav-links a{
  font-size:12px;font-weight:400;color:var(--text-secondary);
  padding:8px 18px;border-radius:100px;
  transition:all .25s;letter-spacing:0;
}
.nav-links a:hover{color:var(--text);background:rgba(0,0,0,.035)}
.nav-links a.active{color:#fff;background:var(--accent);box-shadow:0 4px 14px var(--accent-glow)}

/* ============================================
   Hero — Glass Card Layout
   ============================================ */
.hero{
  position:relative;z-index:1;
  padding:80px 48px 24px;
  max-width:1400px;margin:0 auto;
  display:grid;grid-template-columns:1fr auto;gap:20px;
  align-items:center;
}
.hero-left{}
@media(min-width:1025px){
  .hero{padding:80px 48px 24px}
  body{zoom:.85}
}
.hero-tag{
  font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-secondary);margin-bottom:16px;
}
.hero-title{
  font-size:clamp(28px,3.8vw,48px);font-weight:340;letter-spacing:-.03em;
  line-height:1.15;margin-bottom:10px;
}
.hero-title span{display:block}
.hero-desc{font-size:13px;color:var(--text-secondary);font-weight:350;line-height:1.7;max-width:380px}
.hero-right{}
.avatar-card{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:24px 28px;border-radius:var(--radius-lg);
  background:rgba(255,255,255,.35);backdrop-filter:blur(32px) saturate(200%);-webkit-backdrop-filter:blur(32px) saturate(200%);
  border:1px solid rgba(255,255,255,.4);box-shadow:0 8px 32px rgba(0,0,0,.04),inset 0 1px 0 rgba(255,255,255,.5);
  text-align:center;transition:box-shadow .4s,transform .4s;
  min-width:170px;position:relative;overflow:hidden;
}
.avatar-card::after{
  content:'';position:absolute;top:0;left:16px;right:16px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  pointer-events:none;
}
.avatar-card:hover{box-shadow:0 24px 64px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.7);transform:translateY(-3px)}
.avatar-img{
  width:80px;height:80px;border-radius:50%;overflow:hidden;
  background:linear-gradient(135deg,#e8e6e1,#d5d2cc);
  box-shadow:0 8px 24px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.5);
}
.avatar-img img{width:100%;height:100%;object-fit:cover}
.avatar-name{font-size:15px;font-weight:550;letter-spacing:-.01em;position:relative;z-index:1}
.avatar-role{font-size:12px;color:var(--text-secondary);letter-spacing:.04em;margin-top:-8px;position:relative;z-index:1}
.avatar-email{
  font-size:12px;color:var(--text-secondary);letter-spacing:.02em;
  padding:7px 16px;border-radius:100px;
  background:rgba(0,0,0,.04);transition:all .25s;
  position:relative;z-index:1;
}
.avatar-email:hover{background:rgba(0,0,0,.05);color:var(--text-secondary)}

/* ============================================
   Filter — Glass Pills
   ============================================ */
.filter-section{position:relative;z-index:1;padding:0 48px;max-width:1400px;margin:0 auto 20px}
.filter-list{display:flex;gap:10px;flex-wrap:wrap;list-style:none}
.filter-btn{
  padding:10px 24px;border-radius:100px;
  font-size:13px;font-weight:480;letter-spacing:.02em;
  color:var(--text-secondary);
  background:var(--glass-mid);backdrop-filter:var(--blur-mid);-webkit-backdrop-filter:var(--blur-mid);
  border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);
  transition:all .35s var(--ease-out);
  position:relative;overflow:hidden;cursor:pointer;
}
.filter-btn::after{
  content:'';position:absolute;top:0;left:16px;right:16px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  opacity:0;transition:opacity .35s;
}
.filter-btn:hover{
  color:var(--text);background:var(--glass-strong);
  border-color:var(--glass-border-strong);
  transform:translateY(-1px) scale(1.03);
  box-shadow:0 6px 20px rgba(0,0,0,.06);
}
.filter-btn:hover::after{opacity:1}
.filter-btn:active{transform:scale(.96)}
.filter-btn.active{
  color:#fff;background:var(--accent);border-color:var(--accent);
  box-shadow:0 4px 20px var(--accent-glow);
  transform:scale(1);
}
.filter-btn.active::after{display:none}
.filter-btn span{position:relative;z-index:1}

/* ============================================
   Gallery — Masonry (CSS Columns, varying heights)
   ============================================ */
.gallery{
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:12px;align-items:start;
  padding:0 20px 64px;max-width:1400px;margin:0 auto;
  position:relative;z-index:1;
}
.work-card{
  position:relative;cursor:pointer;
  background:rgba(255,255,255,.75);backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);
  border:1px solid rgba(0,0,0,.07);border-radius:18px;
  box-shadow:
    0 1px 3px rgba(0,0,0,.04),
    0 4px 18px rgba(0,0,0,.06),
    0 14px 44px rgba(0,0,0,.05),
    inset 0 1px 0 rgba(255,255,255,.65);
  overflow:hidden;
  opacity:0;transform:translateY(20px);
  transition:box-shadow .45s var(--ease-out),transform .45s var(--ease-out),opacity .5s;
}
.work-card::after{
  content:'';position:absolute;top:0;left:10px;right:10px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  pointer-events:none;z-index:2;opacity:0;transition:opacity .35s;
}
.work-card:hover::after{opacity:1}
.work-card.revealed{opacity:1;transform:translateY(0)}
.work-card:hover{
  box-shadow:
    0 1px 3px rgba(0,0,0,.05),
    0 8px 28px rgba(0,0,0,.09),
    0 20px 56px rgba(0,0,0,.07),
    inset 0 1px 0 rgba(255,255,255,.7);
  transform:translateY(-4px);
}
.work-card:active{transform:scale(.98)}
.work-card.revealed:hover{transform:translateY(-4px)}
.work-card.revealed:active{transform:scale(.98)}
.work-card-image{
  position:relative;overflow:hidden;contain:layout paint;
  margin:3px 3px 0;border-radius:12px;
  background:#e8e6e2;
}
.work-card-image img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transition:transform .8s var(--ease-out);
}
.work-card:hover .work-card-image img{transform:scale(1.06)}
.work-card-glass-overlay{
  position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.4) 100%);
  opacity:0;transition:opacity .4s;pointer-events:none;
  border-radius:var(--radius-sm);
  display:flex;align-items:flex-end;padding:16px;
}
.work-card:hover .work-card-glass-overlay{opacity:1}
.work-card-glass-overlay span{
  color:#fff;font-size:11px;font-weight:500;letter-spacing:.08em;
  padding:6px 14px;border-radius:100px;
  background:rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.3);
}
/* Compact info — tight to image, auto-adapts */
.work-card-info{
  padding:7px 9px 7px;position:relative;z-index:1;
}
.work-card-category{
  display:none;
  font-size:10.5px;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-secondary);margin-bottom:3px;
}
.work-card-title{font-size:12px;font-weight:530;letter-spacing:-.01em;line-height:1.3}
.work-card-price{font-size:17px;font-weight:700;color:#ff1744;margin-top:3px;letter-spacing:.02em}

/* ============================================
   Detail Overlay — Full Glass
   ============================================ */
.detail-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(245,245,245,.3);backdrop-filter:blur(80px);-webkit-backdrop-filter:blur(80px);
  overflow-y:auto;overflow-x:hidden;
  visibility:hidden;opacity:0;transform:scale(.96);
  transition:visibility .35s,opacity .35s,transform .35s cubic-bezier(.22,1,.36,1);
  scroll-behavior:smooth;will-change:transform,opacity;
}
.detail-overlay.open{visibility:visible;opacity:1;transform:scale(1)}
.detail-overlay::-webkit-scrollbar{width:4px}
.detail-overlay::-webkit-scrollbar-thumb{background:rgba(0,0,0,.1);border-radius:2px}

.detail-header{
  position:sticky;top:14px;z-index:10;
  margin:14px auto 0;width:calc(100% - 48px);max-width:700px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;height:52px;
  background:var(--glass-strong);backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);
  border:1px solid var(--glass-border-strong);border-radius:100px;
  box-shadow:var(--glass-shadow-lg);
}
.detail-header::after{content:'';position:absolute;top:0;left:24px;right:24px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);pointer-events:none}
.detail-title-inline{
  font-size:14px;font-weight:520;letter-spacing:-.01em;
  position:absolute;left:50%;transform:translateX(-50%);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%;
}
.detail-back{
  display:flex;align-items:center;gap:4px;
  font-size:13px;font-weight:480;color:var(--text-secondary);
  padding:7px 12px;border-radius:100px;
  transition:all .25s;position:relative;z-index:1;flex-shrink:0;
}
.detail-back:hover{color:var(--text);background:rgba(0,0,0,.04)}
.detail-back svg{width:16px;height:16px;transition:transform .3s}
.detail-back:hover svg{transform:translateX(-2px)}
.detail-nav-actions{display:flex;gap:6px;align-items:center;position:relative;z-index:1}
.detail-nav-btn{
  width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;
  transition:all .25s;color:var(--text-secondary);
  border-radius:100px;
}
.detail-nav-btn:hover{color:var(--text);background:rgba(0,0,0,.05)}
.detail-nav-btn svg{width:16px;height:16px}
.detail-counter{
  font-size:12px;font-weight:450;color:var(--text-tertiary);
  letter-spacing:.04em;font-variant-numeric:tabular-nums;font-family:'Inter',monospace;
  position:relative;z-index:1;flex-shrink:0;
}

.detail-back-to-top{
  position:fixed;bottom:28px;right:28px;z-index:210;
  width:44px;height:44px;border-radius:50%;
  background:var(--glass-strong);backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);
  border:1px solid var(--glass-border-strong);color:var(--text-secondary);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--glass-shadow-lg);
  opacity:0;visibility:hidden;transform:translateY(8px);
  transition:all .3s var(--ease-out);
}
.detail-back-to-top:hover{color:var(--accent);transform:translateY(-2px)}
.detail-back-to-top.visible{opacity:1;visibility:visible;transform:translateY(0)}
.detail-back-to-top svg{width:18px;height:18px}

.detail-body{max-width:700px;margin:0 auto;padding:24px 20px 64px;transition:opacity .25s,transform .25s cubic-bezier(.22,1,.36,1)}
.detail-body.swipe-out-left{opacity:0;transform:translate3d(-60px,0,0)}
.detail-body.swipe-out-right{opacity:0;transform:translate3d(60px,0,0)}
.detail-hero{width:100%;max-width:68%;margin:0 auto 20px;position:relative}
.detail-hero-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;border-radius:var(--radius-lg);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
.detail-hero-track::-webkit-scrollbar{display:none}
.detail-hero-slide{flex:0 0 100%;scroll-snap-align:start;position:relative;aspect-ratio:3/4;background:#e8e6e2;overflow:hidden}
.detail-hero-slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.detail-hero-dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.detail-hero-dot{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.15);transition:all .3s}
.detail-hero-dot.active{background:var(--accent);width:18px;border-radius:3px}
.detail-hero-arrows{display:flex}
.detail-hero-arrow{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border:1px solid rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;transition:all .25s;color:var(--text-secondary)}
.detail-hero-arrow:hover{background:#fff;color:var(--text)}
.detail-hero-arrow.prev{left:10px}
.detail-hero-arrow.next{right:10px}
.detail-hero-arrow svg{width:18px;height:18px}
.detail-content-nav{display:flex;justify-content:center;align-items:center;gap:16px;padding:40px 0 0}
.detail-nav-pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 28px;border-radius:100px;
  font-size:13px;font-weight:500;letter-spacing:.02em;
  color:var(--text-secondary);
  background:var(--glass-strong);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);
  transition:all .25s var(--ease-out);cursor:pointer;
}
.detail-nav-pill:hover{color:var(--text);box-shadow:var(--glass-shadow-lg);transform:translateY(-1px)}
.detail-nav-pill:active{transform:scale(.97)}
.detail-nav-pill svg{width:16px;height:16px}
.detail-nav-pill:disabled,.detail-nav-pill[disabled]{opacity:.3;pointer-events:none}
.detail-title-section{margin-bottom:24px}
.detail-category{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:8px}
.detail-title{font-size:clamp(22px,3.5vw,32px);font-weight:350;letter-spacing:-.02em;line-height:1.2;margin-bottom:12px}
.detail-desc{font-size:13px;color:var(--text-secondary);line-height:1.8;max-width:500px}
.detail-price{font-size:26px;font-weight:700;color:#ff1744;margin-top:14px;letter-spacing:.02em}
.detail-meta{
  display:grid;grid-template-columns:repeat(4,1fr);gap:24px;
  padding:16px 0;border-top:1px solid rgba(0,0,0,.05);border-bottom:1px solid rgba(0,0,0,.05);
  margin-bottom:24px;
}
.detail-meta-label{font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:5px}
.detail-meta-value{font-size:13px;font-weight:520}

.detail-content-blocks{display:flex;flex-direction:column;gap:0}
.detail-block-image{
  margin-bottom:0;border-radius:0;overflow:hidden;
  background:#e8e6e2;
  opacity:0;transform:translateY(20px);
  transition:opacity .55s,transform .55s var(--ease-out);
}
.detail-block-image.revealed{opacity:1;transform:translateY(0)}
.detail-block-image img{width:100%;display:block}
.detail-block-text{
  padding:36px 0;margin-bottom:4px;
  opacity:0;transform:translateY(20px);
  transition:opacity .55s,transform .55s var(--ease-out);
}
.detail-block-text.revealed{opacity:1;transform:translateY(0)}
.detail-block-text h3{font-size:20px;font-weight:520;letter-spacing:-.01em;margin-bottom:10px}
.detail-block-text p{font-size:14px;color:var(--text-secondary);line-height:1.85;max-width:560px}

.detail-bottom-nav{
  display:flex;justify-content:center;align-items:center;gap:0;
  padding:40px 24px 64px;margin-top:48px;
}
.detail-bottom-nav .detail-bottom-link{
  font-size:13px;font-weight:500;letter-spacing:.03em;
  color:var(--text-secondary);
  display:flex;align-items:center;gap:6px;
  padding:10px 22px;
  transition:all .25s;
}
.detail-bottom-nav .detail-bottom-link:first-child{border-radius:100px 0 0 100px}
.detail-bottom-nav .detail-bottom-link:last-child{border-radius:0 100px 100px 0}
.detail-bottom-nav .detail-bottom-link:hover{color:var(--text);background:rgba(0,0,0,.03)}
.detail-nav-divider{width:1px;height:18px;background:rgba(0,0,0,.08);flex-shrink:0}
/* glass pill container for bottom nav */
.detail-bottom-nav{
  background:var(--glass-strong);backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);
  border:1px solid var(--glass-border-strong);border-radius:100px;
  box-shadow:var(--glass-shadow);display:inline-flex;
  margin:48px auto 0;width:auto;max-width:90vw;
}

/* ============================================
   Footer
   ============================================ */
.footer{position:relative;z-index:1;padding:44px;text-align:center}
.footer-text{font-size:12px;color:var(--text-tertiary);letter-spacing:.02em}

/* ============================================
   Responsive
   ============================================ */
@media(max-width:1024px){

<script>
/* ============================================
   Canvas Particle System — Enhanced
   ============================================ */
(function(){
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles, rings, currentScrollY = 0, targetScrollY = 0;

  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight * 1.3; }

  function createElements(){
    const pCount = Math.floor((W * H) / 15000);
    particles = [];
    const colors = [
      'rgba(0,113,227,','rgba(120,105,220,','rgba(180,155,130,',
      'rgba(100,165,210,','rgba(165,140,185,','rgba(80,150,170,',
      'rgba(190,120,150,','rgba(130,140,200,',
    ];
    for(let i = 0; i < pCount; i++){
      particles.push({
        x:Math.random()*W, y:Math.random()*H,
        vx:(Math.random()-.5)*.3, vy:(Math.random()-.5)*.3,
        r:Math.random()*2.2+1.2,
        color:colors[Math.floor(Math.random()*colors.length)],
        alpha:Math.random()*.4+.08,
        pulse:Math.random()*Math.PI*2
      });
    }
    // Floating glass rings
    rings = [];
    const ringCount = Math.floor((W * H) / 200000);
    for(let i = 0; i < ringCount; i++){
      rings.push({
        x:Math.random()*W, y:Math.random()*H,
        r:Math.random()*60+30,
        vx:(Math.random()-.5)*.15, vy:(Math.random()-.5)*.15,
        alpha:Math.random()*.06+.02,
        rot:Math.random()*Math.PI*2, rotV:(Math.random()-.5)*.002
      });
    }
  }

  function draw(){
    // Smooth scroll lerp for parallax
    currentScrollY += (targetScrollY - currentScrollY) * 0.06;
    const py = currentScrollY * 0.08; // parallax offset for particles
    const ry = currentScrollY * 0.04; // parallax offset for rings (slower = deeper)

    ctx.clearRect(0,0,W,H);
    // Particles
    for(let i = 0; i < particles.length; i++){
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      if(p.x < -30) p.x = W+30; if(p.x > W+30) p.x = -30;
      if(p.y < -30) p.y = H+30; if(p.y > H+30) p.y = -30;
      p.pulse += .008;

      const dy = p.y - py; // parallax-shifted draw y
      const glow = ctx.createRadialGradient(p.x,dy,0,p.x,dy,p.r*3.5);
      const a = p.alpha * (1 + Math.sin(p.pulse)*.25);
      glow.addColorStop(0, p.color + (a*1.3) + ')');
      glow.addColorStop(.45, p.color + (a*.5) + ')');
      glow.addColorStop(1, p.color + '0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(p.x, dy, p.r*3.5, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = p.color + a + ')';
      ctx.beginPath(); ctx.arc(p.x, dy, p.r, 0, Math.PI*2); ctx.fill();
    }
    // Connections
    ctx.lineWidth = .35;
    for(let i = 0; i < particles.length; i++){
      for(let j = i+1; j < particles.length; j++){
        const dx = particles[i].x-particles[j].x;
        const dy = (particles[i].y-py)-(particles[j].y-py);
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < 130){
          ctx.strokeStyle = 'rgba(0,0,0,' + (0.028*(1-dist/130)) + ')';
          ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y-py); ctx.lineTo(particles[j].x, particles[j].y-py); ctx.stroke();
        }
      }
    }
    // Glass rings (deeper parallax layer)
    for(let i = 0; i < rings.length; i++){
      const r = rings[i];
      r.x += r.vx; r.y += r.vy; r.rot += r.rotV;
      if(r.x < -80) r.x = W+80; if(r.x > W+80) r.x = -80;
      if(r.y < -80) r.y = H+80; if(r.y > H+80) r.y = -80;
      ctx.save(); ctx.translate(r.x, r.y - ry); ctx.rotate(r.rot);
      ctx.strokeStyle = 'rgba(0,0,0,' + r.alpha + ')';
      ctx.lineWidth = .6;
      ctx.beginPath(); ctx.ellipse(0, 0, r.r, r.r*.55, 0, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize',()=>{resize();createElements();});
  window.addEventListener('scroll',()=>{targetScrollY=window.scrollY},{passive:true});
  resize(); createElements(); draw();
})();

        <div class="work-card-price">${w.price||''}</div>
      </div>
    </div>
  `).join('');
  galleryEl.querySelectorAll('.work-card').forEach(card=>{card.addEventListener('click',()=>openDetail(parseInt(card.dataset.id)))});
  requestAnimationFrame(()=>{
    const cards=galleryEl.querySelectorAll('.work-card');
    const obs=new IntersectionObserver((entries)=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('revealed');obs.unobserve(e.target)}})},{threshold:.06,rootMargin:'0px 0px -24px 0px'});
    cards.forEach((c,i)=>{c.style.transitionDelay=`${i*.04}s`;obs.observe(c)});
  });
}

filterList.addEventListener('click',e=>{
  const btn=e.target.closest('.filter-btn');
  if(!btn||btn.dataset.category===activeFilter)return;
  filterList.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');activeFilter=btn.dataset.category;

});

async function openDetail(id){
  works=await loadWorks();
  const w=works.find(x=>x.id===id);if(!w)return;currentWorkId=id;
  if(!w.detail)w.detail=[];
  if(!w.specs)w.specs={};
  if(!w.img)w.img='';
  // Carousel: only gallery images (or main img as fallback), NOT detail blocks
  const carouselImgs=[];
  if(w.gallery&&w.gallery.length>0){w.gallery.forEach(src=>carouselImgs.push(src))}
  else{carouselImgs.push(w.img)}
  let html='';
  if(carouselImgs.length>0){
    html+=`<div class="detail-hero"><div class="detail-hero-track" id="heroTrack">`;
    carouselImgs.forEach((src,i)=>{
      html+=`<div class="detail-hero-slide"><img src="${src}" alt="${w.title}"${i===0?' fetchpriority="high"':' loading="lazy"'}></div>`;
    });
    html+=`</div>`;
    if(carouselImgs.length>1){
      html+=`<div class="detail-hero-dots" id="heroDots">`;
      carouselImgs.forEach((_,i)=>html+=`<div class="detail-hero-dot${i===0?' active':''}" data-idx="${i}"></div>`);
      html+=`</div>`;
      html+=`<div class="detail-hero-arrows"><button class="detail-hero-arrow prev" id="heroPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><button class="detail-hero-arrow next" id="heroNext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button></div>`;
    }
    html+=`</div>`;
  }
  html+=`<div class="detail-title-section"><div class="detail-category">${w.category}</div><h2 class="detail-title">${w.title}</h2><p class="detail-desc">${w.detail.find(d=>d.t==='text')?.c||''}</p>${w.price?`<div class="detail-price">${w.price}</div>`:''}</div>`;
  var metaItems='';
  for(const[k,v]of Object.entries(w.specs)){if(v!=null&&v!=='')metaItems+=`<div class="detail-meta-item"><div class="detail-meta-label">${k}</div><div class="detail-meta-value">${v}</div></div>`}
  if(metaItems)html+=`<div class="detail-meta">${metaItems}</div>`;
  // Content blocks: show ALL detail items (images + text) below carousel
  let sFT=false;html+='<div class="detail-content-blocks">';
  w.detail.forEach(b=>{if(b.t==='text'&&!sFT){sFT=true;return}if(b.t==='image')html+=`<div class="detail-block-image" data-reveal><img src="${b.src||w.img}" alt="${w.title}" loading="lazy"></div>`;else html+=`<div class="detail-block-text" data-reveal><h3>${b.title}</h3><p>${b.c}</p></div>`});
  html+='</div>';
  // Bottom nav — switch between works
  html+=`<div class="detail-content-nav"><button class="detail-nav-pill" id="detailContentPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>上一个作品</button><button class="detail-nav-pill" id="detailContentNext">下一个作品<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button></div>`;
  detailBody.innerHTML=html;detailOverlay.classList.add('open');detailOverlay.scrollTop=0;document.body.style.overflow='hidden';updateDetailNav();
  document.getElementById('detailContentPrev').onclick=()=>navDetail(-1);
  document.getElementById('detailContentNext').onclick=()=>navDetail(1);
  // Carousel logic
  if(carouselImgs.length>1){
    const track=document.getElementById('heroTrack'),dots=document.querySelectorAll('#heroDots .detail-hero-dot');
    let curSlide=0;
    function goSlide(i){
      curSlide=i;track.scrollTo({left:track.clientWidth*i,behavior:'smooth'});
      dots.forEach((d,j)=>d.classList.toggle('active',j===i));
    }
    document.getElementById('heroPrev').onclick=()=>{if(curSlide>0)goSlide(curSlide-1)};
    document.getElementById('heroNext').onclick=()=>{if(curSlide<carouselImgs.length-1)goSlide(curSlide+1)};
    dots.forEach(d=>d.onclick=()=>goSlide(parseInt(d.dataset.idx)));
    track.addEventListener('scroll',()=>{
      const i=Math.round(track.scrollLeft/track.clientWidth);
      if(i!==curSlide){curSlide=i;dots.forEach((d,j)=>d.classList.toggle('active',j===i))}
    });
    // Keyboard arrows for hero carousel
    document.addEventListener('keydown',function heroKey(e){
      if(!detailOverlay.classList.contains('open'))return;
      if(e.key==='ArrowLeft')goSlide(Math.max(0,curSlide-1));
      if(e.key==='ArrowRight')goSlide(Math.min(carouselImgs.length-1,curSlide+1));
    });
  }
  requestAnimationFrame(()=>{const blocks=detailBody.querySelectorAll('[data-reveal]');const obs=new IntersectionObserver((entries)=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('revealed');obs.unobserve(e.target)}})},{threshold:.08,rootMargin:'0px 0px -32px 0px'});blocks.forEach(b=>obs.observe(b))});
}

function closeDetail(){detailOverlay.classList.remove('open');document.body.style.overflow='';currentWorkId=null;detailBackToTop.classList.remove('visible')}
function updateDetailNav(){const idx=works.findIndex(w=>w.id===currentWorkId);const w=works[idx];const p=idx>0,n=idx<works.length-1;
  var cp=document.getElementById('detailContentPrev'),cn=document.getElementById('detailContentNext');
  if(cp){cp.style.opacity=p?'1':'.35';cp.style.pointerEvents=p?'auto':'none'}
  if(cn){cn.style.opacity=n?'1':'.35';cn.style.pointerEvents=n?'auto':'none'}
  detailCounter.textContent=`${String(idx+1).padStart(2,'0')} / ${String(works.length).padStart(2,'0')}`;detailTitleInline.textContent=w?w.title:''}
function navDetail(dir){const idx=works.findIndex(w=>w.id===currentWorkId);const n=works[idx+dir];if(!n)return;detailBody.classList.add(dir>0?'swipe-out-left':'swipe-out-right');setTimeout(()=>{openDetail(n.id);detailBody.classList.remove('swipe-out-left','swipe-out-right')},220)}

detailBack.addEventListener('click',closeDetail);
document.addEventListener('keydown',e=>{if(!detailOverlay.classList.contains('open'))return;if(e.key==='Escape')closeDetail();if(e.key==='ArrowLeft')navDetail(-1);if(e.key==='ArrowRight')navDetail(1)});
var tsX=0,tsY=0;detailOverlay.addEventListener('touchstart',e=>{tsX=e.touches[0].clientX;tsY=e.touches[0].clientY},{passive:true});detailOverlay.addEventListener('touchend',e=>{var dx=e.changedTouches[0].clientX-tsX,dy=e.changedTouches[0].clientY-tsY;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)navDetail(dx>0?-1:1)});
detailOverlay.addEventListener('click',e=>{if(!e.target.closest('button')&&!e.target.closest('a')&&!e.target.closest('input')&&!e.target.closest('textarea'))closeDetail()});
detailOverlay.addEventListener('scroll',()=>{detailBackToTop.classList.toggle('visible',detailOverlay.scrollTop>400)},{passive:true});
detailBackToTop.addEventListener('click',()=>{detailOverlay.scrollTo({top:0,behavior:'smooth'})});

// Esc to close detail
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&detailOverlay.classList.contains('open')){closeDetail()}
});

// Enhanced Liquid Glass Nav — scroll-linked morph
(function(){
  var ticking=false;
  window.addEventListener('scroll',function(){
    if(ticking)return;ticking=true;
    requestAnimationFrame(function(){
      var y=window.scrollY;
      if(y>200&&y>lastScrollY+6)nav.classList.add('hidden');
      else if(y<lastScrollY-3)nav.classList.remove('hidden');
      lastScrollY=y;
      var t=Math.min(y/500,1);
      nav.style.transform='translateX(-50%) scale('+(1-t*.06)+')';
      nav.style.borderRadius=(28-t*10)+'px';
      nav.style.background='rgba(255,255,255,'+(.72+t*.2)+')';
      var bp=(28+t*12),st=(200-t*50);
      nav.style.backdropFilter='blur('+bp+'px) saturate('+st+'%)';
      nav.style.webkitBackdropFilter='blur('+bp+'px) saturate('+st+'%)';
      ticking=false;
    });
  },{passive:true});
})();

// Navigation scroll-spy — highlight current section
const heroSection=document.querySelector('.hero');
const gallerySection=document.getElementById('works');
const navLinks=document.querySelectorAll('.nav-links a');
const spyObserver=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.target===gallerySection&&e.isIntersecting){
      navLinks.forEach(a=>a.classList.remove('active'));
      navLinks[0].classList.add('active');
    }
  });
},{threshold:.1,rootMargin:'-80px 0px 0px 0px'});
spyObserver.observe(gallerySection);
if(heroSection)spyObserver.observe(heroSection);
// Click nav to highlight, scroll resets to 作品
navLinks.forEach(function(a){a.addEventListener("click",function(){navLinks.forEach(function(x){x.classList.remove("active")});a.classList.add("active")})});// ============================================
// Hero Text — Staggered Character Reveal
// ============================================
(function(){
  const title=document.querySelector('.hero-title');
  if(!title)return;
  const html=title.innerHTML;
  let chars='',ci=0;
  for(let i=0;i<html.length;i++){
    if(html[i]==='<'){while(i<html.length&&html[i]!=='>'){chars+=html[i];i++}chars+=html[i];continue}
    chars+=`<span style="display:inline-block;opacity:0;transform:translateY(40px);animation:charIn .55s var(--ease-out) forwards;animation-delay:${ci*28}ms">${html[i]}</span>`;
    ci++;
  }
  title.innerHTML=chars;
  const style=document.createElement('style');
  style.textContent=`@keyframes charIn{to{opacity:1;transform:translateY(0)}}`;
  document.head.appendChild(style);
})();
